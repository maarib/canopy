name: Ontario Parks fall colour data
on:
  schedule:
    # Daily at 15:00 UTC (11:00 Eastern) during fall colour season, Sept–Nov
    - cron: '0 15 * 9-11 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/scrape-ontario-parks.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ontario-parks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Ontario Parks fall colour data"
            git push
          fi
