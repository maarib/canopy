name: Provincial park boundaries (Ontario MNR)
on:
  schedule:
    # Monthly, 1st at 11:30 UTC. Boundaries change when a park is regulated or amended.
    - cron: '30 11 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run data:park-boundaries
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/park-boundaries
          # The build script only rewrites outlines that changed.
          if ! git diff --cached --quiet; then
            git commit -m "Update provincial park boundaries"
            git push
          fi
