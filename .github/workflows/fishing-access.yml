name: Fishing access points (Ontario MNR)
on:
  schedule:
    # Monthly, 1st at 11:00 UTC. The ministry updates this layer a few times a year.
    - cron: '0 11 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run data:fishing
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fishing-access.json
          # The build script leaves the file untouched when no point changed.
          if ! git diff --cached --quiet; then
            git commit -m "Update fishing access points"
            git push
          fi
