name: Park facilities (Ontario Parks)
on:
  schedule:
    # Weekly, Mondays 10:00 UTC. Facilities and activities change a few times a season.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run data:park-facilities
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/park-facilities.json
          # The scraper leaves the file untouched when no park changed.
          if ! git diff --cached --quiet; then
            git commit -m "Update park facilities (Ontario Parks)"
            git push
          fi
