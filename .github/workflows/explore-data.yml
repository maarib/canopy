name: Explore data (trails & places)
on:
  schedule:
    # Weekly, Mondays 09:00 UTC. Trails and places change slowly.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:explore
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/explore
          # The build script leaves files untouched when trails and places are unchanged.
          if ! git diff --cached --quiet; then
            git commit -m "Update explore data (trails & places)"
            git push
          fi
