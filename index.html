<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2600c" />
    <!-- The theme in force, set before the first paint (see src/lib/theme.ts). -->
    <script>
      try {
        var t = localStorage.getItem('canopy:theme')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <title>Canopy · Fall colors across Canada</title>
    <meta name="description" content="Track fall colors, leaf drop, weather and trails across Canada." />
    <!-- Warm up connections the app needs right away: map engine, sightings, photos. -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://api.inaturalist.org" crossorigin />
    <link rel="dns-prefetch" href="https://inaturalist-open-data.s3.amazonaws.com" />
    <!-- The faces the first screen uses, fetched alongside the app instead of after its CSS. -->
    <link rel="preload" href="/src/assets/fonts/livvic-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/livvic-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/livvic-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/zalando-sans-expanded-400-900-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
